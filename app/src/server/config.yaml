# 系统配置
system:
  env: 'local'
  addr: 26610

# JWT签名（与 core/auth 共享 secret，实现跨服务认证）
jwt:
  signing-key: '${JWT_SECRET}'
  expires-time: '24h'
  buffer-time: '1h'
  issuer: 'nucleagent-auth'

# 认证配置
auth:
  provider: 'builtin'

# 权限控制
rbac:
  provider: 'builtin'

# Zap日志配置
zap:
  level: 'info'
  prefix: '[NUCLEAGENT-STORAGE]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

# MySQL配置
mysql:
  host: '${DB_HOST}'
  port: '${DB_PORT}'
  db-name: '${DB_NAME}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
  config: 'charset=utf8mb4&parseTime=True&loc=Local'
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: 'error'
  log-zap: false

# 跨域配置
cors:
  mode: 'strict-whitelist'
  whitelist:
    - allow-origin: '${WEB_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,X-Namespace,X-Service-Name,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${CORE_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,X-Namespace,X-Service-Name,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true

# 存储配置
storage:
  provider: '${STORAGE_PROVIDER:-local}'   # local（开发）或 cs（生产）
  max-size: 104857600                      # 单文件上限 100MB
  sign-secret: '${STORAGE_SIGN_SECRET:-nucleagent_storage_dev_secret}'  # LocalProvider 上传/下载 URL 签名密钥

  # CS（cs.101.com）后端：客户端直传 CS、直连 CDN 下载
  cs:
    host: 'http://cs.101.com/v0.1'
    cdn-host: 'https://cdncs.101.com/v0.1'
    server-name: '${CS_SERVER_NAME}'
    access-key: '${CS_ACCESS_KEY}'
    secret-key: '${CS_SECRET_KEY}'
    user-id: '${CS_USER_ID}'
    scope: 1                               # 0=私有（签名下载），1=公开
    expires: 1800                           # 下载签名有效期（秒）
    timeout: 60

  # 本地磁盘后端（开发环境）：客户端直传本服务的 /blob 端点
  local:
    dir: '${STORAGE_LOCAL_DIR:-./data/uploads}'
    base-url: '${STORAGE_LOCAL_BASE_URL:-http://localhost:26610}'
    expires: 1800

  # 命名空间隔离：不同调用方写到不同路径前缀
  namespaces:
    - name: 'core'
      prefix: '/nucleagent/core/'
    - name: 'executor'
      prefix: '/nucleagent/executor/'
