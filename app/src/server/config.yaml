# 系统配置
system:
  env: 'local'
  addr: 26610

# JWT签名（与 core/auth 共享 secret，实现跨服务认证）
jwt:
  signing-key: '${JWT_SECRET}'
  expires-time: '24h'
  buffer-time: '1h'
  issuer: 'nucleagent-auth'

# 认证配置
auth:
  provider: 'builtin'

# 权限控制
rbac:
  provider: 'builtin'

# Zap日志配置
zap:
  level: 'info'
  prefix: '[NUCLEAGENT-STORAGE]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

# MySQL配置
mysql:
  host: '${DB_HOST}'
  port: '${DB_PORT}'
  db-name: '${DB_NAME}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
  config: 'charset=utf8mb4&parseTime=True&loc=Local'
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: 'error'
  log-zap: false

# 跨域配置
cors:
  mode: 'strict-whitelist'
  whitelist:
    - allow-origin: '${WEB_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,X-Namespace,X-Service-Name,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${CORE_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,X-Namespace,X-Service-Name,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true

# 存储配置
#
# 默认 local（本地磁盘）：开箱即用，文件落在 ./data/uploads（已 gitignore）。
# 其它后端通过插件接入（见 plugins/ 目录），配置段约定 storage.{provider 名}。
storage:
  provider: '${STORAGE_PROVIDER:-local}'
  max-size: 104857600                      # 单文件上限 100MB
  sign-secret: '${STORAGE_SIGN_SECRET:-nucleagent_storage_dev_secret}'  # LocalProvider 上传/下载 URL 签名密钥

  # 本地磁盘后端（默认）：客户端直传本服务的 /blob 端点
  local:
    dir: '${STORAGE_LOCAL_DIR:-./data/uploads}'
    base-url: '${STORAGE_LOCAL_BASE_URL:-http://localhost:26610}'
    expires: 1800

  # 其它后端（如对象存储/私有网关）由插件提供（plugins/ 目录）：
  #   storage.provider: {插件名}
  #   storage.{插件名}: {...}   # 配置段约定，详见各插件 README
  # 凭据只走环境变量，绝不入库。

  # 后端拆进 submodule 后这段必须留在主 config —— 插件按 storage.cs 子树注册，
  cs:
    host: '${CS_HOST:-https://cs.101.com/v0.1}'
    # 下载走 gcdncs（全球 CDN），不是从 host 推导的 cdncs —— 配错下载全 403/404。
    cdn-host: '${CS_CDN_HOST:-https://gcdncs.101.com/v0.1}'
    # 必须是 agentia：CS 凭据绑定在 agentia 服务空间，nucleagent 复用它。
    server-name: '${CS_SERVER_NAME:-agentia}'
    access-key: '${CS_ACCESS_KEY}'
    secret-key: '${CS_SECRET_KEY}'
    user-id: '${CS_USER_ID:-0}'
    scope: 1
    expires: 1800

  # 命名空间隔离：不同调用方写到不同路径前缀
  namespaces:
    - name: 'core'
      prefix: '/core/'
    - name: 'executor'
      prefix: '/executor/'
